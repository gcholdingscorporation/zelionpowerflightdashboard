# ZelionDash - sensor overrides
#
# Copy this file to /WIDGETS/ZelionDash/sensors.cfg on the radio, next to
# main.lua. It is already named correctly - do not open and re-save it in
# Notepad unless you need to, since that is where a stray .txt comes from.
#
# Changes take effect on the next power-cycle, or after toggling any widget
# option. Check the result on the sensor map: the bracket after each sensor
# says how it was bound - (cfg) is this file, (auto) is a known name,
# (guess) is inferred from the unit.
#
# This is a minimal working file. The full reference, with every role and
# every setting, is docs/sensors.cfg.example in the repository.
#
#
# SCOPE OVERRIDES TO A MODEL WHERE YOU CAN
#
# A [*] section applies to every model on the radio, which is rarely what an
# override means. Switching throttle off is right for a flight controller that
# does not publish one and wrong for a Rotorflight heli that does - in [*] it
# silently costs you a real reading on the second aircraft.
#
# Section names are the EdgeTX model name, matched case-insensitively. A
# model's own section beats [*].


# The OMPHOBBY OSF03 heli. Named ">Rotorflight" in EdgeTX, which is confusing
# but harmless - the section has to match the model name, not the aircraft.
[>Rotorflight]

# There is no Thr sensor on this flight controller, so the unit pass hands
# throttle the first spare percent sensor on the radio - TQly, the transmitter
# link quality - and the dashboard reads a permanent THR 100%. "off" is the
# only thing that stops it: naming some other sensor falls through to the same
# guess.
throttle = off

# Already correct as a guess, so this changes nothing today. It is here
# because the guess refuses to bind when two sensors share a unit: add any
# second volt-unit sensor later and cellVoltage would quietly go unbound,
# taking the 3.40 V low-cell alert with it. Pinning it keeps the alert.
cellVoltage = Volt


# The OMPHOBBY M7R on Rotorflight needs nothing. It publishes ARM flags, a
# governor, BEC voltage and a real throttle, and all of them bind by name.
# Left here as a reminder that an empty section is a fine answer.
[Omphobby M7R]
