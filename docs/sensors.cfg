# ZelionDash - sensor overrides
#
# Copy this file to /WIDGETS/ZelionDash/sensors.cfg on the radio, next to
# main.lua. It is already named correctly - do not open and re-save it in
# Notepad unless you need to, since that is where a stray .txt comes from.
#
# Changes take effect on the next power-cycle, or after toggling any widget
# option. Check the result on the sensor map: the bracket after each sensor
# says how it was bound - (cfg) is this file, (auto) is a known name,
# (guess) is inferred from the unit.
#
# This is a minimal working file for the fleet the widget was built around.
# The full reference, with every role and every setting, is
# docs/sensors.cfg.example in the repository.
#
#
# SCOPE EVERYTHING AS NARROWLY AS YOU CAN
#
# Sections resolve [*] -> [model slot] -> [cells:N] -> [craft], most specific
# winning, and both the sensor bindings and the [battery] settings travel that
# chain. A [*] section applies to every model on the radio, which is rarely
# what an override means: switching throttle off is right for a flight
# controller that does not publish one and wrong for a Rotorflight heli that
# does, and in [*] it silently costs a real reading on the second aircraft.
#
# Model section names are the EdgeTX model name, matched case-insensitively.
# Craft section names are what the flight controller calls the aircraft.


# ---------------------------------------------------------------------------
# Settings
# ---------------------------------------------------------------------------
#
# How much pack the time-remaining estimate treats as untouchable. The timer
# reaches zero when the pack reaches this, not when it is flat.
#
# 40 is measured, not derived: rested cell voltage against the percentage the
# pack was actually landed at. Two earlier attempts to compute it from voltage
# walked 45 -> 54 -> 57 and were abandoned in favour of flying and writing the
# numbers down.
#
# It is written here, in [battery], so it covers the whole radio. It can be
# written in any section instead - see sensors.cfg.example - and the two ends
# of this fleet do want different figures: the same 3.80 V rested is about 45%
# on a 6S 2200 and about 41% on the 2S micro. Scope it per aircraft once there
# are enough landings on each to say so with a straight face.
[battery]
reservePct = 40


# ---------------------------------------------------------------------------
# >Rotorflight - the Rotorflight helicopters
# ---------------------------------------------------------------------------
#
# The M7R on 12S, the ALZRC Devil 380 and the OMP M4 Max on 6S, all flown from
# this one model slot with their configuration on the flight controllers.
#
# Nothing is needed here. Rotorflight publishes ARM flags, a governor and BEC
# voltage and all of them bind by name, and it reports a craft name, so the
# widget knows which of the three is on the bench and rebinds the moment it
# changes. Throttle is only published if it is switched on in Rotorflight's
# CRSF telemetry list; when it is not, the role stays unbound rather than
# guessing, which is correct.
#
# Left here deliberately: an empty section is a fine answer, and its absence
# would read as an oversight.
[>Rotorflight]


# ---------------------------------------------------------------------------
# OMP Microheli - the two OSF03 micros
# ---------------------------------------------------------------------------
#
# The M2 V3 on 3S and the M1 V3 on 2S. OSF03 publishes no craft name, so these
# two are told apart by cell count alone - see the [cells:N] sections below.

[OMP Microheli]

# OSF03 calls its cell voltage "Volt", which is a candidate name for no role,
# so it can only ever arrive by the unit guess - and that guess binds only when
# exactly one unclaimed sensor carries the unit, with packVoltage resolved
# first and taking its pick. Pinning the name takes cell voltage out of that
# contest. Left to the guess, a second volt-unit sensor appearing later unbinds
# it silently and the 3.40 V low-cell alert goes with it.
cellVoltage = Volt

# There is no Thr sensor on this flight controller. This no longer does what it
# was written for - throttle once bound TQly, the transmitter link quality, and
# showed a permanent 100%, and that cannot recur now that a sensor another role
# knows by name is never offered as a guess. What it still refuses is a guess
# at some percent sensor the widget has never heard of, which throttle would
# take. It is also a true statement about the aircraft.
throttle = off


# ---------------------------------------------------------------------------
# Naming what cannot name itself
# ---------------------------------------------------------------------------
#
# craftName is the one key here that is not a role binding: it is what to call
# the aircraft, and it is written to the flight log. Nothing else on this fleet
# is 3S or 2S, so the cell count is enough to separate them.
#
# A reported craft name always beats a cell count, because a name is a fact and
# a count is an inference.

[cells:3]
craftName = Omphobby M2 V3

[cells:2]
craftName = Omphobby M1 V3
