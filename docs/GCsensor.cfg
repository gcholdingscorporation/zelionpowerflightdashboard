# GCsensor.cfg - one real fleet, as a worked example
#
# This is the maintainer's own sensors.cfg. The helicopters in it are real and
# the reserve percentages are measured off their landings rather than picked.
# It is here to be read, not installed: the model slots, the craft names and
# the cell counts are all specific to one radio, and on yours most of these
# sections would simply sit there doing nothing.
#
# Setting up your own? Start from docs/sensors.cfg.example. That is the
# documented reference for every role and every setting, and it is the file the
# release zip carries onto the card.
#
# What is worth taking from here is the shape rather than the values: how
# narrowly each setting is scoped, and what a section looks like once its
# number has been flown instead of guessed.
#
# This is a snapshot. The radio it came from moves ahead of it.
#
# Reading the result on a radio: changes take effect on the next power-cycle,
# or after toggling any widget option, and the bracket after each sensor on the
# sensor map says how it was bound - (cfg) is this file, (auto) is a known
# name, (guess) is inferred from the unit.
#
#
# SCOPE EVERYTHING AS NARROWLY AS YOU CAN
#
# Sections resolve [*] -> [model slot] -> [cells:N] -> [craft], most specific
# winning, and both the sensor bindings and the [battery] settings travel that
# chain. A [*] section applies to every model on the radio, which is rarely
# what an override means: switching throttle off is right for a flight
# controller that does not publish one and wrong for a Rotorflight heli that
# does, and in [*] it silently costs a real reading on the second aircraft.
#
# Model section names are the EdgeTX model name, matched case-insensitively.
# Craft section names are what the flight controller calls the aircraft.


# ---------------------------------------------------------------------------
# Settings
# ---------------------------------------------------------------------------
#
# How much pack the time-remaining estimate treats as untouchable. The timer
# reaches zero when the pack reaches this, not when it is flat.
#
# 40 is measured, not derived: rested cell voltage against the percentage the
# pack was actually landed at. Two earlier attempts to compute it from voltage
# walked 45 -> 54 -> 57 and were abandoned in favour of flying and writing the
# numbers down.
#
# It is written here, in [battery], so it is the figure for anything the
# sections below do not name: the M7R on 12S and the Devil 380, neither of
# which has been calibrated yet.
[battery]
reservePct = 40


# ---------------------------------------------------------------------------
# >Rotorflight - the Rotorflight helicopters
# ---------------------------------------------------------------------------
#
# The M7R on 12S, the ALZRC Devil 380 and the OMP M4 Max on 6S, all flown from
# this one model slot with their configuration on the flight controllers.
#
# Nothing is needed here. Rotorflight publishes ARM flags, a governor and BEC
# voltage and all of them bind by name, and it reports a craft name, so the
# widget knows which of the three is on the bench and rebinds the moment it
# changes. Throttle is only published if it is switched on in Rotorflight's
# CRSF telemetry list; when it is not, the role stays unbound rather than
# guessing, which is correct.
#
# Left here deliberately: an empty section is a fine answer, and its absence
# would read as an oversight.
[>Rotorflight]


# ---------------------------------------------------------------------------
# OMP Microheli - the two OSF03 micros
# ---------------------------------------------------------------------------
#
# The M2 V3 on 3S and the M1 V3 on 2S. OSF03 publishes no craft name, so these
# two are told apart by cell count alone - see the [cells:N] sections below.

[OMP Microheli]

# 41%, from five landings on the micros: rested cell voltage against the
# percentage the pack was at when it came down, least squares, read at the
# 3.80 V that is the target. The radio-wide 40 was close enough to look
# right here and is not - see the M4 Max below for why one number cannot
# serve both ends of this fleet.
reservePct = 41

# OSF03 calls its cell voltage "Volt", which is a candidate name for no role,
# so it can only ever arrive by the unit guess - and that guess binds only when
# exactly one unclaimed sensor carries the unit, with packVoltage resolved
# first and taking its pick. Pinning the name takes cell voltage out of that
# contest. Left to the guess, a second volt-unit sensor appearing later unbinds
# it silently and the 3.40 V low-cell alert goes with it.
cellVoltage = Volt

# There is no Thr sensor on this flight controller. This no longer does what it
# was written for - throttle once bound TQly, the transmitter link quality, and
# showed a permanent 100%, and that cannot recur now that a sensor another role
# knows by name is never offered as a guess. What it still refuses is a guess
# at some percent sensor the widget has never heard of, which throttle would
# take. It is also a true statement about the aircraft.
throttle = off


# ---------------------------------------------------------------------------
# Naming what cannot name itself
# ---------------------------------------------------------------------------
#
# craftName is the one key here that is not a role binding: it is what to call
# the aircraft, and it is written to the flight log. Nothing else on this fleet
# is 3S or 2S, so the cell count is enough to separate them.
#
# A reported craft name always beats a cell count, because a name is a fact and
# a count is an inference.

[cells:3]
craftName = Omphobby M2 V3

# 45%, and it lives here rather than in an [Omphobby M2 V3] section because the
# OSF03 publishes no craft name at all. The craft link is nil on these two, so a
# section named for the aircraft would sit in this file looking correct and do
# nothing, with no complaint on the sensor map, because an inert section is not
# an error. A cells section is in the chain and follows the aircraft across
# model slots, which is what is wanted here.
#
# It beats the 41 in [OMP Microheli] above regardless of where either sits in
# this file: the chain is resolved in order, not in file order, and cells comes
# after the model slot.
#
# Two rested landings, 3.77 V at 40% and 3.78 V at 41%, carried to the 3.80 V
# target on the slope the two well-sampled aircraft agree on. That is a starting
# point borrowed from other helicopters, not this one's own measurement, and it
# is written down as such. The 2S micro keeps the measured 41, since [cells:2]
# names no reserve and falls through to the slot.
reservePct = 45

[cells:2]
craftName = Omphobby M1 V3


# ---------------------------------------------------------------------------
# Reserves that belong to one helicopter
# ---------------------------------------------------------------------------
#
# Section named for the craft, which is what the flight controller reports -
# the model slot cannot separate these, since the Devil 380 and the M4 Max fly
# from the same one on the same size pack.
#
# The number is measured the same way as the micros' and comes out four points
# higher: 45% against 41% for the same 3.80 V rested. That gap is the whole
# argument for scoping - a single radio-wide figure is short on one of these
# helicopters or early on the other, and the midpoint is both.
#
# Five landings per aircraft is not many. These are the best figures there are
# rather than settled ones, and more flights may move them.
#
# A section name binds if it matches EITHER the EdgeTX model slot OR the craft
# name the flight controller reports, and the craft link wins because it comes
# last in the chain. So this one reaches the M4 Max by its reported name from
# whatever slot it is flown from - and it would also reach every aircraft in a
# model slot that happened to be called "OMP M4 Max", which is worth knowing
# before reusing an aircraft's name for a slot.
#
# Match neither and the section is inert: it sits here looking correct and does
# nothing. The sensor map's CONFIG row names the sections that actually applied,
# so read it there rather than trusting this comment.
[OMP M4 Max]
reservePct = 45


# ---------------------------------------------------------------------------
# The M7R on 12S
# ---------------------------------------------------------------------------
#
# Rotorflight reports the craft name, so this binds at the craft link and
# follows the aircraft out of whatever slot it flies from.
#
# 46%. Three rested landings, 3.74 to 3.78 V at 38 to 39%. All three sit inside
# the same two points of pack, so there is not enough spread to fit a slope of
# its own and this one is carried on the slope the better-sampled aircraft
# agree on: a starting point, like the M2 V3's above, rather than a measurement.
# Force a fit through those three and the R squared is 0.08, which is the
# honest reason the number is not claimed as measured.
#
# Before it, the M7R flew the radio-wide 40 in [battery], six points short.
[Omphobby M7R]
reservePct = 46


# The ALZRC Devil 380 has no calibration of its own yet. It shares the 6S 2200
# packs with the M4 Max and runs the same flight controller, so 45 is probably
# right for it too - but probably is an inference from another aircraft's
# landings, and this file does not write inferences down as though they were
# measurements.
#
# So it flies the [battery] 40 in the meantime. The section above binds on the
# M4 Max's reported name and the Devil reports its own, so sharing the slot and
# the packs does not share the reserve. Fly it, read the rested voltages back
# out of the log, and add:
#
#   [ALZRC Devil 380]
#   reservePct = 45
